<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DVoice overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font: 600 15px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff; display: flex; flex-direction: column; padding: 4px;
    box-sizing: border-box; user-select: none;
  }
  body.bottom { justify-content: flex-end; }
  body.right { align-items: flex-end; }
  .row {
    display: flex; align-items: center; gap: 10px; margin: 3px 0;
    padding: 5px 12px 5px 5px; border-radius: 999px;
    background: rgba(17, 21, 28, .72); opacity: .55; max-width: 100%;
    transition: opacity .08s;
  }
  .row.speaking { opacity: 1; }
  .row.muted .nm { text-decoration: line-through; opacity: .7; }
  .ava {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-size: 14px;
    background: #1a212b; border: 3px solid #2b3442; box-sizing: border-box;
  }
  .row.speaking .ava { border-color: #f5b942; box-shadow: 0 0 0 3px rgba(245,185,66,.3); }
  .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
</style>
</head>
<body>
<script>
const body = document.body;
window.ovNative && window.ovNative.onData(({ list, corner }) => {
  body.className = (corner && corner[0] === 'b' ? 'bottom ' : '') + (corner && corner[1] === 'r' ? 'right' : '');
  body.textContent = '';
  for (const p of list) {
    const row = document.createElement('div');
    row.className = 'row' + (p.speaking ? ' speaking' : '') + (p.muted ? ' muted' : '');
    const ava = document.createElement('div');
    ava.className = 'ava';
    ava.textContent = (p.name.trim().charAt(0) || '?').toUpperCase();
    const nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = p.name;
    row.append(ava, nm);
    body.append(row);
  }
});
</script>
</body>
</html>
